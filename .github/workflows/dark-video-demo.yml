name: DARK VIDEO demo checks
on:
  push:
    branches:
      - feature/dark-video-ai-foundation
  pull_request:
    branches:
      - work/dark-editor-1.0-stabilization
      - main
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/dark-video.spec.js\n      - run: npm run test:dark-ai
