name: Deploy DARK WORK BRIDGE

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-bridge/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dark-work-bridge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy new Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-bridge
          wranglerVersion: "4"
