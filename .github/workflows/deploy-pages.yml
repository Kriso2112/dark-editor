name: Deploy DARK EDITOR to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate PWA files and scripts
        run: |
          test -s index.html
          test -s manifest.json
          test -s service-worker.js
          test -s icon.svg
          node --check service-worker.js
          node -e "const m = JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')); if (m.start_url !== './' || m.scope !== './' || !m.icons?.length) throw new Error('Invalid PWA manifest');"
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((match, index) => new vm.Script(match[1], { filename: 'inline-' + (index + 1) + '.js' }));
          if (!html.includes('rel="manifest"')) throw new Error('Manifest link missing');
          if (!html.includes('serviceWorker.register')) throw new Error('Service worker registration missing');
          console.log('PWA shell and inline JavaScript checks passed.');
          NODE

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
