name: DARK EDITOR persistence browser tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/project-persistence-indexeddb]

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test persistence in Chromium
        run: node tests/persistence.spec.cjs
